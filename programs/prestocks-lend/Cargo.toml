[package]
name = "prestocks-lend"
version = "0.1.1"
description = "Isolated lending for PreStocks (Token-2022) on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "prestocks_lend"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.31.1", features = ["token_2022"] }
